<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANALOG — digital images, reformatted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0A0A0A;
    --bg-2: #101010;
    --paper: #E8E4DA;
    --fog: #6E6B65;
    --line: #1D1D1D;
    --line-2: #2A2A2A;
    --hot: #FF6B00;
  }
  html, body {
    background: var(--bg);
    color: var(--paper);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.5;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--paper); color: var(--bg); }

  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
  }

  /* ─── HEADER ─── */
  header {
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    background: var(--bg);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .wordmark {
    font-family: 'VT323', ui-monospace, monospace;
    font-size: 36px;
    line-height: 0.8;
    letter-spacing: 0.02em;
  }
  .brand-tag {
    color: var(--fog);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
  .readout {
    color: var(--fog);
    display: flex;
    gap: 18px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .readout span::before {
    content: "//";
    margin-right: 6px;
    color: var(--line-2);
  }
  .readout .live { color: var(--paper); }

  /* ─── MAIN ─── */
  main {
    display: grid;
    grid-template-columns: 260px 1fr 260px;
    min-height: 0;
  }
  aside {
    padding: 20px;
    overflow-y: auto;
    background: var(--bg);
  }
  aside.left { border-right: 1px solid var(--line); }
  aside.right { border-left: 1px solid var(--line); }

  aside::-webkit-scrollbar { width: 6px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: var(--line-2); }

  .panel { margin-bottom: 24px; }
  .panel-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--fog);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--paper);
  }

  /* ─── STAGE ─── */
  .stage {
    background:
      radial-gradient(circle, #171717 1px, transparent 1px) 0 0/14px 14px,
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  .stage::before {
    content: '';
    position: absolute;
    top: 12px; left: 12px;
    width: 20px; height: 20px;
    border-top: 1px solid var(--line-2);
    border-left: 1px solid var(--line-2);
  }
  .stage::after {
    content: '';
    position: absolute;
    bottom: 12px; right: 12px;
    width: 20px; height: 20px;
    border-bottom: 1px solid var(--line-2);
    border-right: 1px solid var(--line-2);
  }
  canvas.output {
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    display: block;
  }
  .stage-empty {
    color: var(--fog);
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: 20px;
    letter-spacing: 0.1em;
  }

  /* ─── CONTROLS ─── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

  .btn-cell {
    background: transparent;
    border: 1px solid var(--line-2);
    color: var(--paper);
    padding: 9px 10px;
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    text-align: left;
    transition: background 0.08s, color 0.08s;
  }
  .btn-cell:hover { background: var(--line); }
  .btn-cell.active {
    background: var(--paper);
    color: var(--bg);
    border-color: var(--paper);
  }

  .control { margin-bottom: 14px; }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fog);
    margin-bottom: 6px;
  }
  .control .val { color: var(--paper); font-variant-numeric: tabular-nums; }

  input[type=range] {
    width: 100%;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    height: 20px;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 1px;
    background: var(--line-2);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 6px;
    height: 20px;
    background: var(--paper);
    margin-top: -10px;
    cursor: grab;
  }
  input[type=range]::-moz-range-track {
    height: 1px;
    background: var(--line-2);
  }
  input[type=range]::-moz-range-thumb {
    width: 6px;
    height: 20px;
    background: var(--paper);
    border-radius: 0;
    border: 0;
    cursor: grab;
  }

  .toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    user-select: none;
  }
  .toggle:last-child { border-bottom: 0; }
  .toggle .switch {
    width: 26px;
    height: 12px;
    border: 1px solid var(--paper);
    position: relative;
    flex-shrink: 0;
  }
  .toggle .switch::after {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    background: var(--paper);
    top: 1px;
    left: 1px;
    transition: left 0.12s;
  }
  .toggle.on .switch::after { left: 15px; }
  .toggle.on .switch { background: var(--paper); }
  .toggle.on .switch::after { background: var(--bg); }

  /* ─── FOOTER ─── */
  footer {
    border-top: 1px solid var(--line);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    background: var(--bg);
  }
  .footer-note {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--fog);
  }
  .footer-note b { color: var(--paper); font-weight: 400; }

  .btn {
    background: var(--paper);
    color: var(--bg);
    border: 0;
    padding: 12px 24px;
    font-family: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    font-weight: 700;
    transition: background 0.08s;
  }
  .btn:hover { background: var(--hot); color: var(--bg); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--line-2);
    width: 100%;
    padding: 10px;
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    margin-bottom: 6px;
    transition: background 0.08s;
  }
  .btn-ghost:hover { background: var(--line); }

  /* ─── SOCIALS + CA ─── */
  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .ca {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border: 1px solid var(--line-2);
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--paper);
    background: transparent;
    cursor: pointer;
    transition: background 0.08s, border-color 0.08s, color 0.08s;
    user-select: none;
  }
  .ca:hover { background: var(--line); border-color: var(--paper); }
  .ca-label { color: var(--fog); }
  .ca-value { color: var(--paper); font-variant-numeric: tabular-nums; }
  .ca.copied { border-color: var(--hot); }
  .ca.copied .ca-value, .ca.copied .ca-label { color: var(--hot); }

  .x-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border: 1px solid var(--line-2);
    color: var(--paper);
    text-decoration: none;
    transition: background 0.08s, color 0.08s, border-color 0.08s;
    flex-shrink: 0;
  }
  .x-link:hover {
    background: var(--paper);
    color: var(--bg);
    border-color: var(--paper);
  }
  .x-link svg { display: block; }

  /* ─── DROP OVERLAY ─── */
  .drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.94);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
  }
  .drop-overlay.active { display: flex; }
  .drop-inner {
    border: 2px dashed var(--paper);
    padding: 60px 100px;
    text-align: center;
  }
  .drop-inner .big {
    font-family: 'VT323', monospace;
    font-size: 72px;
    line-height: 0.9;
    letter-spacing: 0.05em;
  }
  .drop-inner .sub {
    margin-top: 8px;
    color: var(--fog);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  /* ─── MOBILE ─── */
  @media (max-width: 900px) {
    html, body { overflow: auto; }
    .app { height: auto; min-height: 100vh; }
    main {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(320px, 60vh) auto;
    }
    aside {
      max-height: none;
    }
    aside.left { border-right: 0; border-bottom: 1px solid var(--line); }
    aside.right { border-left: 0; border-top: 1px solid var(--line); }
    header {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .readout { justify-content: flex-start; font-size: 10px; gap: 12px; }
    .header-right { justify-content: flex-start; gap: 10px; width: 100%; }
    footer { flex-direction: column; align-items: stretch; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="app">

  <header>
    <div class="brand">
      <div class="wordmark">ANALOG</div>
      <div class="brand-tag">v0.1 // dither engine</div>
    </div>
    <div class="header-right">
      <div class="readout">
        <span id="r-mode">MODE: FLOYD</span>
        <span id="r-pal">PAL: MONO</span>
        <span id="r-dim">— × —</span>
        <span class="live" id="r-status">READY</span>
      </div>
      <button class="ca" id="ca-display" title="Click to copy contract address" type="button">
        <span class="ca-label">CA</span>
        <span class="ca-value" id="ca-value">0x0000…0000</span>
      </button>
      <a class="x-link" href="https://x.com/YOUR_HANDLE" target="_blank" rel="noopener noreferrer" aria-label="Follow ANALOG on X">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>
    </div>
  </header>

  <main>

    <aside class="left">
      <div class="panel">
        <div class="panel-title">Source</div>
        <button class="btn-ghost" id="load-btn">Upload image</button>
        <button class="btn-ghost" id="sample-btn">Load sample</button>
        <input type="file" id="file-input" accept="image/*" hidden>
      </div>

      <div class="panel">
        <div class="panel-title">Algorithm</div>
        <div class="grid-2" id="modes">
          <button class="btn-cell active" data-mode="floyd">Floyd</button>
          <button class="btn-cell" data-mode="atkinson">Atkinson</button>
          <button class="btn-cell" data-mode="bayer">Bayer</button>
          <button class="btn-cell" data-mode="halftone">Halftone</button>
          <button class="btn-cell" data-mode="threshold">Threshold</button>
          <button class="btn-cell" data-mode="noise">Noise</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Preset</div>
        <div class="grid-2" id="presets">
          <button class="btn-cell" data-preset="photocopy">Photocopy</button>
          <button class="btn-cell" data-preset="newsprint">Newsprint</button>
          <button class="btn-cell" data-preset="fax">Fax</button>
          <button class="btn-cell" data-preset="gameboy">Gameboy</button>
          <button class="btn-cell" data-preset="terminal">Terminal</button>
          <button class="btn-cell" data-preset="vhs">VHS</button>
        </div>
      </div>
    </aside>

    <div class="stage">
      <canvas class="output" id="canvas"></canvas>
    </div>

    <aside class="right">
      <div class="panel">
        <div class="panel-title">Adjust</div>
        <div class="control">
          <label>Threshold <span class="val" id="v-th">128</span></label>
          <input type="range" id="threshold" min="0" max="255" value="128">
        </div>
        <div class="control">
          <label>Contrast <span class="val" id="v-co">0</span></label>
          <input type="range" id="contrast" min="-100" max="100" value="0">
        </div>
        <div class="control">
          <label>Scale <span class="val" id="v-sc">1×</span></label>
          <input type="range" id="scale" min="1" max="8" value="1">
        </div>
        <div class="control">
          <label>Grain <span class="val" id="v-gr">0</span></label>
          <input type="range" id="grain" min="0" max="100" value="0">
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Palette</div>
        <div class="grid-2" id="palettes">
          <button class="btn-cell active" data-palette="mono">Mono</button>
          <button class="btn-cell" data-palette="amber">Amber</button>
          <button class="btn-cell" data-palette="green">Green</button>
          <button class="btn-cell" data-palette="red">Red</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Overlay</div>
        <div class="toggle" id="invert-toggle">
          <span>Invert</span>
          <div class="switch"></div>
        </div>
        <div class="toggle" id="scanlines-toggle">
          <span>Scanlines</span>
          <div class="switch"></div>
        </div>
        <div class="toggle" id="vignette-toggle">
          <span>Vignette</span>
          <div class="switch"></div>
        </div>
      </div>
    </aside>

  </main>

  <footer>
    <div class="footer-note">
      <b>ANALOG</b> // A tool for degrading digital images with intention. Drop any image anywhere.
    </div>
    <button class="btn" id="download-btn">Download PNG</button>
  </footer>

</div>

<div class="drop-overlay" id="drop-overlay">
  <div class="drop-inner">
    <div class="big">DROP TO INGEST</div>
    <div class="sub">any image format</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  ANALOG v0.1 — dither engine
// ═══════════════════════════════════════════════════════════════

const state = {
  sourceImage: null,
  mode: 'floyd',
  palette: 'mono',
  invert: false,
  scanlines: false,
  vignette: false,
  threshold: 128,
  contrast: 0,
  scale: 1,
  grain: 0,
};

const palettes = {
  mono:  { dark: [10, 10, 10],   light: [232, 228, 218] },
  amber: { dark: [12, 8, 4],     light: [255, 149, 0]   },
  green: { dark: [4, 12, 6],     light: [90, 240, 110]  },
  red:   { dark: [14, 4, 4],     light: [255, 60, 60]   },
};

const presets = {
  photocopy: { mode: 'threshold', threshold: 140, contrast: 45, scale: 1, grain: 18, palette: 'mono',  invert: false, scanlines: false, vignette: false },
  newsprint: { mode: 'halftone',  threshold: 128, contrast: 15, scale: 2, grain: 0,  palette: 'mono',  invert: false, scanlines: false, vignette: false },
  fax:       { mode: 'threshold', threshold: 128, contrast: 60, scale: 1, grain: 32, palette: 'mono',  invert: false, scanlines: false, vignette: false },
  gameboy:   { mode: 'bayer',     threshold: 128, contrast: 20, scale: 4, grain: 0,  palette: 'green', invert: false, scanlines: false, vignette: false },
  terminal:  { mode: 'floyd',     threshold: 100, contrast: 35, scale: 2, grain: 6,  palette: 'amber', invert: true,  scanlines: true,  vignette: true  },
  vhs:       { mode: 'noise',     threshold: 118, contrast: 15, scale: 1, grain: 42, palette: 'mono',  invert: false, scanlines: true,  vignette: true  },
};

// ─── DITHER ALGORITHMS ───────────────────────────────────────────
function floydSteinberg(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  const buf = new Float32Array(gray);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = buf[i];
      const nw = old < t ? 0 : 255;
      out[i] = nw;
      const err = old - nw;
      if (x + 1 < w) buf[i + 1] += err * 7 / 16;
      if (y + 1 < h) {
        if (x > 0)     buf[i + w - 1] += err * 3 / 16;
        buf[i + w] += err * 5 / 16;
        if (x + 1 < w) buf[i + w + 1] += err * 1 / 16;
      }
    }
  }
  return out;
}

function atkinson(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  const buf = new Float32Array(gray);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = buf[i];
      const nw = old < t ? 0 : 255;
      out[i] = nw;
      const err = (old - nw) / 8;
      if (x + 1 < w) buf[i + 1] += err;
      if (x + 2 < w) buf[i + 2] += err;
      if (y + 1 < h) {
        if (x > 0)     buf[i + w - 1] += err;
        buf[i + w] += err;
        if (x + 1 < w) buf[i + w + 1] += err;
      }
      if (y + 2 < h) buf[i + 2 * w] += err;
    }
  }
  return out;
}

const BAYER4 = [
  [0,  8,  2, 10],
  [12, 4, 14,  6],
  [3, 11,  1,  9],
  [15, 7, 13,  5],
];
function bayer(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const bias = (BAYER4[y % 4][x % 4] / 16) * 255;
      const adj  = gray[y * w + x] + (bias - 128) * 0.7;
      out[y * w + x] = adj < t ? 0 : 255;
    }
  }
  return out;
}

const CLUSTER8 = [
  [24,10,12,26,35,47,49,37],
  [ 8, 0, 2,14,45,59,61,51],
  [22, 6, 4,16,43,57,63,53],
  [30,20,18,28,33,41,55,39],
  [34,46,48,36,25,11,13,27],
  [44,58,60,50, 9, 1, 3,15],
  [42,56,62,52,23, 7, 5,17],
  [32,40,54,38,31,21,19,29],
];
function halftone(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const bias = CLUSTER8[y % 8][x % 8] * 4;
      out[y * w + x] = gray[y * w + x] < bias ? 0 : 255;
    }
  }
  return out;
}

function thresholdDither(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  for (let i = 0; i < gray.length; i++) out[i] = gray[i] < t ? 0 : 255;
  return out;
}

function noiseDither(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  for (let i = 0; i < gray.length; i++) {
    const n = (Math.random() - 0.5) * 128;
    out[i] = (gray[i] + n) < t ? 0 : 255;
  }
  return out;
}

const ALGOS = { floyd: floydSteinberg, atkinson, bayer, halftone, threshold: thresholdDither, noise: noiseDither };

// ─── PROCESSING PIPELINE ────────────────────────────────────────
function processImage(src, workW, workH) {
  const wc = document.createElement('canvas');
  wc.width = workW; wc.height = workH;
  const wcx = wc.getContext('2d', { willReadFrequently: true });
  wcx.drawImage(src, 0, 0, workW, workH);
  const imgData = wcx.getImageData(0, 0, workW, workH);
  const data = imgData.data;

  // grayscale + contrast + grain
  const gray = new Float32Array(workW * workH);
  const c = state.contrast;
  const cf = (259 * (c + 255)) / (255 * (259 - c)); // contrast factor
  const g = state.grain;
  for (let i = 0; i < gray.length; i++) {
    const r = data[i*4], gr = data[i*4+1], b = data[i*4+2];
    let v = 0.299 * r + 0.587 * gr + 0.114 * b;
    v = cf * (v - 128) + 128;
    if (g > 0) v += (Math.random() - 0.5) * g * 2;
    gray[i] = v < 0 ? 0 : v > 255 ? 255 : v;
  }

  const algo = ALGOS[state.mode] || floydSteinberg;
  const out = algo(gray, workW, workH, state.threshold);

  // map to palette
  const p = palettes[state.palette];
  const dark  = state.invert ? p.light : p.dark;
  const light = state.invert ? p.dark  : p.light;
  for (let i = 0; i < out.length; i++) {
    const col = out[i] === 0 ? dark : light;
    data[i*4]   = col[0];
    data[i*4+1] = col[1];
    data[i*4+2] = col[2];
    data[i*4+3] = 255;
  }
  wcx.putImageData(imgData, 0, 0);
  return wc;
}

function applyOverlays(ctx, w, h) {
  if (state.scanlines) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    for (let y = 1; y < h; y += 3) ctx.fillRect(0, y, w, 1);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (state.vignette) {
    const grad = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.75);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.85)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }
}

// ─── RENDER ─────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let renderPending = false;

function render() {
  if (!state.sourceImage) return;
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => {
    renderPending = false;
    doRender();
  });
}

function doRender() {
  const src = state.sourceImage;
  const stage = document.querySelector('.stage');
  const maxW = stage.clientWidth  - 64;
  const maxH = stage.clientHeight - 64;
  const ratio = Math.min(maxW / src.width, maxH / src.height, 1);
  const displayW = Math.max(4, Math.floor(src.width  * ratio));
  const displayH = Math.max(4, Math.floor(src.height * ratio));
  const workW = Math.max(4, Math.floor(displayW / state.scale));
  const workH = Math.max(4, Math.floor(displayH / state.scale));

  document.getElementById('r-status').textContent = 'PROCESSING…';
  const processed = processImage(src, workW, workH);

  canvas.width  = displayW;
  canvas.height = displayH;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(processed, 0, 0, displayW, displayH);
  applyOverlays(ctx, displayW, displayH);

  document.getElementById('r-mode').textContent   = 'MODE: ' + state.mode.toUpperCase();
  document.getElementById('r-pal').textContent    = 'PAL: '  + state.palette.toUpperCase();
  document.getElementById('r-dim').textContent    = `${workW}×${workH}`;
  document.getElementById('r-status').textContent = 'RENDERED';
}

// ─── DOWNLOAD (full-res) ────────────────────────────────────────
function download() {
  if (!state.sourceImage) return;
  const src = state.sourceImage;
  const workW = Math.max(4, Math.floor(src.width  / state.scale));
  const workH = Math.max(4, Math.floor(src.height / state.scale));
  const processed = processImage(src, workW, workH);

  const oc = document.createElement('canvas');
  oc.width = src.width; oc.height = src.height;
  const ocx = oc.getContext('2d');
  ocx.imageSmoothingEnabled = false;
  ocx.drawImage(processed, 0, 0, src.width, src.height);
  applyOverlays(ocx, src.width, src.height);

  const link = document.createElement('a');
  link.download = `analog-${Date.now()}.png`;
  link.href = oc.toDataURL('image/png');
  link.click();
}

// ─── SAMPLE IMAGE (meta: dithered A becomes the logo) ───────────
function loadSample() {
  const c = document.createElement('canvas');
  c.width = 900; c.height = 900;
  const cx = c.getContext('2d');
  // vertical gradient
  const grad = cx.createLinearGradient(0, 0, 0, 900);
  grad.addColorStop(0,   '#ffffff');
  grad.addColorStop(0.5, '#7a7a7a');
  grad.addColorStop(1,   '#050505');
  cx.fillStyle = grad;
  cx.fillRect(0, 0, 900, 900);
  // huge A
  cx.fillStyle = '#000';
  cx.font = 'bold 820px Georgia, "Times New Roman", serif';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText('A', 450, 480);
  // sparkle of noise so dither has grain to bite
  const nd = cx.getImageData(0, 0, 900, 900);
  for (let i = 0; i < nd.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 24;
    nd.data[i]   += n;
    nd.data[i+1] += n;
    nd.data[i+2] += n;
  }
  cx.putImageData(nd, 0, 0);

  const img = new Image();
  img.onload = () => { state.sourceImage = img; render(); };
  img.src = c.toDataURL();
}

// ─── FILE LOADING ───────────────────────────────────────────────
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => { state.sourceImage = img; render(); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ─── UI WIRING ──────────────────────────────────────────────────
document.getElementById('load-btn').onclick   = () => document.getElementById('file-input').click();
document.getElementById('sample-btn').onclick = loadSample;
document.getElementById('file-input').onchange = (e) => loadFile(e.target.files[0]);
document.getElementById('download-btn').onclick = download;

// mode buttons
document.querySelectorAll('#modes .btn-cell').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#modes .btn-cell').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    render();
  };
});

// palette buttons
document.querySelectorAll('#palettes .btn-cell').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#palettes .btn-cell').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.palette = btn.dataset.palette;
    render();
  };
});

// preset buttons
document.querySelectorAll('#presets .btn-cell').forEach(btn => {
  btn.onclick = () => {
    const p = presets[btn.dataset.preset];
    Object.assign(state, p);
    syncUI();
    render();
  };
});

// sliders
['threshold', 'contrast', 'scale', 'grain'].forEach(id => {
  document.getElementById(id).oninput = (e) => {
    state[id] = parseInt(e.target.value);
    updateSliderLabels();
    render();
  };
});

// toggles
function bindToggle(id, key) {
  const el = document.getElementById(id);
  el.onclick = () => {
    state[key] = !state[key];
    el.classList.toggle('on', state[key]);
    render();
  };
}
bindToggle('invert-toggle',   'invert');
bindToggle('scanlines-toggle','scanlines');
bindToggle('vignette-toggle', 'vignette');

function updateSliderLabels() {
  document.getElementById('v-th').textContent = state.threshold;
  document.getElementById('v-co').textContent = state.contrast > 0 ? '+' + state.contrast : state.contrast;
  document.getElementById('v-sc').textContent = state.scale + '×';
  document.getElementById('v-gr').textContent = state.grain;
}

function syncUI() {
  document.querySelectorAll('#modes .btn-cell').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === state.mode));
  document.querySelectorAll('#palettes .btn-cell').forEach(b =>
    b.classList.toggle('active', b.dataset.palette === state.palette));
  document.getElementById('threshold').value = state.threshold;
  document.getElementById('contrast').value  = state.contrast;
  document.getElementById('scale').value     = state.scale;
  document.getElementById('grain').value     = state.grain;
  updateSliderLabels();
  document.getElementById('invert-toggle').classList.toggle('on', state.invert);
  document.getElementById('scanlines-toggle').classList.toggle('on', state.scanlines);
  document.getElementById('vignette-toggle').classList.toggle('on', state.vignette);
}

// ─── DRAG & DROP ────────────────────────────────────────────────
let dragCount = 0;
window.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragCount++;
  document.getElementById('drop-overlay').classList.add('active');
});
window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragCount--;
  if (dragCount <= 0) {
    dragCount = 0;
    document.getElementById('drop-overlay').classList.remove('active');
  }
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragCount = 0;
  document.getElementById('drop-overlay').classList.remove('active');
  loadFile(e.dataTransfer.files[0]);
});

// resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});

// ─── SOCIALS / CA ───────────────────────────────────────────────
// EDIT THESE TWO VALUES:
const CA_ADDRESS = '0x0000000000000000000000000000000000000000';
const X_HANDLE   = 'https://x.com/useanalog';   // without the @

// wire X link
document.querySelector('.x-link').href = `https://x.com/${X_HANDLE}`;

// display truncated CA
function formatCA(addr) {
  if (!addr || addr.length < 12) return addr || '—';
  return addr.slice(0, 6) + '…' + addr.slice(-4);
}
const caEl  = document.getElementById('ca-display');
const caVal = document.getElementById('ca-value');
caVal.textContent = formatCA(CA_ADDRESS);

caEl.onclick = async () => {
  const originalHTML = caVal.textContent;
  try {
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(CA_ADDRESS);
    } else {
      const ta = document.createElement('textarea');
      ta.value = CA_ADDRESS;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    caEl.classList.add('copied');
    caVal.textContent = 'COPIED';
  } catch (e) {
    caVal.textContent = 'ERROR';
    caEl.classList.add('copied');
  }
  setTimeout(() => {
    caEl.classList.remove('copied');
    caVal.textContent = originalHTML;
  }, 1200);
};

// ─── INIT ───────────────────────────────────────────────────────
updateSliderLabels();
loadSample();
</script>
