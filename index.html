<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0A0A0A;
    --bg-2: #101010;
    --paper: #E8E4DA;
    --fog: #6E6B65;
    --line: #1D1D1D;
    --line-2: #2A2A2A;
    --hot: #FF6B00;
  }
  html, body {
    background: var(--bg);
    color: var(--paper);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.5;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--paper); color: var(--bg); }

  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
  }

  /* ─── HEADER ─── */
  header {
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 4px; }
  .brand-mark {
    height: 44px;
    width: auto;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; gap: 2px; }
  .brand-tag { margin-top: 2px; }
  .wordmark {
    font-family: 'VT323', ui-monospace, monospace;
    font-size: 36px;
    line-height: 0.8;
    letter-spacing: 0.02em;
  }
  .brand-tag {
    color: var(--fog);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
  .readout {
    color: var(--fog);
    display: flex;
    gap: 18px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .readout span::before {
    content: "//";
    margin-right: 6px;
    color: var(--line-2);
  }
  .readout .live { color: var(--paper); }

  /* ─── MAIN ─── */
  main {
    display: grid;
    grid-template-columns: 260px 1fr 260px;
    min-height: 0;
  }
  aside {
    padding: 20px;
    overflow-y: auto;
    background: var(--bg);
  }
  aside.left { border-right: 1px solid var(--line); }
  aside.right { border-left: 1px solid var(--line); }

  aside::-webkit-scrollbar { width: 6px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: var(--line-2); }

  .panel { margin-bottom: 24px; }
  .panel-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--fog);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--paper);
  }

  /* ─── STAGE ─── */
  .stage {
    background:
      radial-gradient(circle, #171717 1px, transparent 1px) 0 0/14px 14px,
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  .stage::before {
    content: '';
    position: absolute;
    top: 12px; left: 12px;
    width: 20px; height: 20px;
    border-top: 1px solid var(--line-2);
    border-left: 1px solid var(--line-2);
  }
  .stage::after {
    content: '';
    position: absolute;
    bottom: 12px; right: 12px;
    width: 20px; height: 20px;
    border-bottom: 1px solid var(--line-2);
    border-right: 1px solid var(--line-2);
  }
  canvas.output {
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    display: block;
  }
  .stage-empty {
    color: var(--fog);
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: 20px;
    letter-spacing: 0.1em;
  }

  /* ─── CONTROLS ─── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

  .btn-cell {
    background: transparent;
    border: 1px solid var(--line-2);
    color: var(--paper);
    padding: 9px 10px;
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    text-align: left;
    transition: background 0.08s, color 0.08s;
  }
  .btn-cell:hover { background: var(--line); }
  .btn-cell.active {
    background: var(--paper);
    color: var(--bg);
    border-color: var(--paper);
  }

  .control { margin-bottom: 14px; }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fog);
    margin-bottom: 6px;
  }
  .control .val { color: var(--paper); font-variant-numeric: tabular-nums; }

  input[type=range] {
    width: 100%;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    height: 20px;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 1px;
    background: var(--line-2);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 6px;
    height: 20px;
    background: var(--paper);
    margin-top: -10px;
    cursor: grab;
  }
  input[type=range]::-moz-range-track {
    height: 1px;
    background: var(--line-2);
  }
  input[type=range]::-moz-range-thumb {
    width: 6px;
    height: 20px;
    background: var(--paper);
    border-radius: 0;
    border: 0;
    cursor: grab;
  }

  .toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    user-select: none;
  }
  .toggle:last-child { border-bottom: 0; }
  .toggle .switch {
    width: 26px;
    height: 12px;
    border: 1px solid var(--paper);
    position: relative;
    flex-shrink: 0;
  }
  .toggle .switch::after {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    background: var(--paper);
    top: 1px;
    left: 1px;
    transition: left 0.12s;
  }
  .toggle.on .switch::after { left: 15px; }
  .toggle.on .switch { background: var(--paper); }
  .toggle.on .switch::after { background: var(--bg); }

  /* ─── FOOTER ─── */
  footer {
    border-top: 1px solid var(--line);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    background: var(--bg);
  }
  .footer-note {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--fog);
  }
  .footer-note b { color: var(--paper); font-weight: 400; }

  .btn {
    background: var(--paper);
    color: var(--bg);
    border: 0;
    padding: 12px 24px;
    font-family: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    font-weight: 700;
    transition: background 0.08s, color 0.08s;
  }
  .btn:hover { background: var(--hot); color: var(--bg); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn.secondary {
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--paper);
    padding: 11px 24px;
  }
  .btn.secondary:hover { background: var(--paper); color: var(--bg); border-color: var(--paper); }
  .btn.success { background: var(--hot) !important; color: var(--bg) !important; }
  .footer-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-random {
    width: 100%;
    background: var(--hot);
    color: var(--bg);
    border: 0;
    padding: 12px 10px;
    font-family: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.08s, color 0.08s, transform 0.08s;
  }
  .btn-random:hover { background: var(--paper); color: var(--bg); }
  .btn-random:active { transform: translateY(1px); }
  .btn-random .dice { display: inline-block; margin-right: 6px; }

  .btn-ghost {
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--line-2);
    width: 100%;
    padding: 10px;
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    margin-bottom: 6px;
    transition: background 0.08s;
  }
  .btn-ghost:hover { background: var(--line); }

  /* ─── SOCIALS + CA ─── */
  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .ca {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border: 1px solid var(--line-2);
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--paper);

  terminal:  { mode: 'floyd',     threshold: 100, contrast: 35, scale: 2, grain: 6,  palette: 'amber', invert: true,  scanlines: true,  vignette: true  },
  vhs:       { mode: 'noise',     threshold: 118, contrast: 15, scale: 1, grain: 42, palette: 'mono',  invert: false, scanlines: true,  vignette: true  },
};

// ─── DITHER ALGORITHMS ───────────────────────────────────────────
function floydSteinberg(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  const buf = new Float32Array(gray);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = buf[i];
      const nw = old < t ? 0 : 255;
      out[i] = nw;
      const err = old - nw;
      if (x + 1 < w) buf[i + 1] += err * 7 / 16;
      if (y + 1 < h) {
        if (x > 0)     buf[i + w - 1] += err * 3 / 16;
        buf[i + w] += err * 5 / 16;
        if (x + 1 < w) buf[i + w + 1] += err * 1 / 16;
      }
    }
  }
  return out;
}

function atkinson(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  const buf = new Float32Array(gray);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = buf[i];
      const nw = old < t ? 0 : 255;
      out[i] = nw;
      const err = (old - nw) / 8;
      if (x + 1 < w) buf[i + 1] += err;
      if (x + 2 < w) buf[i + 2] += err;
      if (y + 1 < h) {
        if (x > 0)     buf[i + w - 1] += err;
        buf[i + w] += err;
        if (x + 1 < w) buf[i + w + 1] += err;
      }
      if (y + 2 < h) buf[i + 2 * w] += err;
    }
  }
  return out;
}

const BAYER4 = [
  [0,  8,  2, 10],
  [12, 4, 14,  6],
  [3, 11,  1,  9],
  [15, 7, 13,  5],
];
function bayer(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const bias = (BAYER4[y % 4][x % 4] / 16) * 255;
      const adj  = gray[y * w + x] + (bias - 128) * 0.7;
      out[y * w + x] = adj < t ? 0 : 255;
    }
  }
  return out;
}

const CLUSTER8 = [
  [24,10,12,26,35,47,49,37],
  [ 8, 0, 2,14,45,59,61,51],
  [22, 6, 4,16,43,57,63,53],
  [30,20,18,28,33,41,55,39],
  [34,46,48,36,25,11,13,27],
  [44,58,60,50, 9, 1, 3,15],
  [42,56,62,52,23, 7, 5,17],
  [32,40,54,38,31,21,19,29],
];
function halftone(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const bias = CLUSTER8[y % 8][x % 8] * 4;
      out[y * w + x] = gray[y * w + x] < bias ? 0 : 255;
    }
  }
  return out;
}

function thresholdDither(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  for (let i = 0; i < gray.length; i++) out[i] = gray[i] < t ? 0 : 255;
  return out;
}

function noiseDither(gray, w, h, t) {
  const out = new Uint8ClampedArray(w * h);
  for (let i = 0; i < gray.length; i++) {
    const n = (Math.random() - 0.5) * 128;
    out[i] = (gray[i] + n) < t ? 0 : 255;
  }
  return out;
}

const ALGOS = { floyd: floydSteinberg, atkinson, bayer, halftone, threshold: thresholdDither, noise: noiseDither };

// ─── PROCESSING PIPELINE ────────────────────────────────────────
function processImage(src, workW, workH) {
  const wc = document.createElement('canvas');
  wc.width = workW; wc.height = workH;
  const wcx = wc.getContext('2d', { willReadFrequently: true });
  wcx.drawImage(src, 0, 0, workW, workH);
  const imgData = wcx.getImageData(0, 0, workW, workH);
  const data = imgData.data;

  // grayscale + contrast + grain
  const gray = new Float32Array(workW * workH);
  const c = state.contrast;
  const cf = (259 * (c + 255)) / (255 * (259 - c)); // contrast factor
  const g = state.grain;
  for (let i = 0; i < gray.length; i++) {
    const r = data[i*4], gr = data[i*4+1], b = data[i*4+2];
    let v = 0.299 * r + 0.587 * gr + 0.114 * b;
    v = cf * (v - 128) + 128;
    if (g > 0) v += (Math.random() - 0.5) * g * 2;
    gray[i] = v < 0 ? 0 : v > 255 ? 255 : v;
  }

  const algo = ALGOS[state.mode] || floydSteinberg;
  const out = algo(gray, workW, workH, state.threshold);

  // map to palette
  const p = palettes[state.palette];
  const dark  = state.invert ? p.light : p.dark;
  const light = state.invert ? p.dark  : p.light;
  for (let i = 0; i < out.length; i++) {
    const col = out[i] === 0 ? dark : light;
    data[i*4]   = col[0];
    data[i*4+1] = col[1];
    data[i*4+2] = col[2];
    data[i*4+3] = 255;
  }
  wcx.putImageData(imgData, 0, 0);
  return wc;
}

function applyOverlays(ctx, w, h) {
  if (state.scanlines) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    for (let y = 1; y < h; y += 3) ctx.fillRect(0, y, w, 1);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (state.vignette) {
    const grad = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.75);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.85)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }
}

// ─── RENDER ─────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let renderPending = false;

function render() {
  if (!state.sourceImage) return;
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => {
    renderPending = false;
    doRender();
  });
}

// Get effective source (with PFP square crop applied if enabled)
function getEffectiveSource() {
  const src = state.sourceImage;
  if (!state.pfp) return src;
  const size = Math.min(src.width || src.naturalWidth, src.height || src.naturalHeight);
  const sx = ((src.width || src.naturalWidth) - size) / 2;
  const sy = ((src.height || src.naturalHeight) - size) / 2;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  c.getContext('2d').drawImage(src, sx, sy, size, size, 0, 0, size, size);
  return c;
}

function doRender() {
  const src = getEffectiveSource();
  const srcW = src.width  || src.naturalWidth;
  const srcH = src.height || src.naturalHeight;
  const stage = document.querySelector('.stage');
  const maxW = stage.clientWidth  - 64;
  const maxH = stage.clientHeight - 64;
  const ratio = Math.min(maxW / srcW, maxH / srcH, 1);
  const displayW = Math.max(4, Math.floor(srcW * ratio));
  const displayH = Math.max(4, Math.floor(srcH * ratio));
  const workW = Math.max(4, Math.floor(displayW / state.scale));
  const workH = Math.max(4, Math.floor(displayH / state.scale));

  document.getElementById('r-status').textContent = 'PROCESSING…';
  const processed = processImage(src, workW, workH);

  canvas.width  = displayW;
  canvas.height = displayH;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(processed, 0, 0, displayW, displayH);
  applyOverlays(ctx, displayW, displayH);

  document.getElementById('r-mode').textContent   = 'MODE: ' + state.mode.toUpperCase();
  document.getElementById('r-pal').textContent    = 'PAL: '  + state.palette.toUpperCase();
  document.getElementById('r-dim').textContent    = state.pfp ? `${workW}×${workH} · PFP` : `${workW}×${workH}`;
  document.getElementById('r-status').textContent = 'RENDERED';
}

// ─── FINAL OUTPUT (used by download + copy) ─────────────────────
function generateFinalOutput() {
  if (!state.sourceImage) return null;
  const src = getEffectiveSource();
  const srcW = src.width  || src.naturalWidth;
  const srcH = src.height || src.naturalHeight;
  const outW = state.pfp ? 400 : srcW;
  const outH = state.pfp ? 400 : srcH;
  const workW = Math.max(4, Math.floor(outW / state.scale));
  const workH = Math.max(4, Math.floor(outH / state.scale));
  const processed = processImage(src, workW, workH);

  const oc = document.createElement('canvas');
  oc.width = outW; oc.height = outH;
  const ocx = oc.getContext('2d');
  ocx.imageSmoothingEnabled = false;
  ocx.drawImage(processed, 0, 0, outW, outH);
  applyOverlays(ocx, outW, outH);
  return oc;
}

function download() {
  const oc = generateFinalOutput();
  if (!oc) return;
  const link = document.createElement('a');
  link.download = `analog-${state.pfp ? 'pfp-' : ''}${Date.now()}.png`;
  link.href = oc.toDataURL('image/png');
  link.click();
}

async function copyToClipboard() {
  const oc = generateFinalOutput();
  if (!oc) return;
  const btn = document.getElementById('copy-btn');
  const original = 'Copy PNG';

  const flash = (label, ms = 1600) => {
    btn.textContent = label;
    btn.classList.add('success');
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('success');
    }, ms);
  };

  // ── Attempt 1: modern Clipboard API with ClipboardItem
  // Safari requires passing Promise<Blob> directly (not awaited) so the
  // browser keeps the async work tied to the user gesture.
  if (navigator.clipboard && window.ClipboardItem) {
    try {
      const blobPromise = new Promise(resolve => oc.toBlob(resolve, 'image/png'));
      await navigator.clipboard.write([
        new ClipboardItem({ 'image/png': blobPromise })
      ]);
      flash('COPIED ✓');
      return;
    } catch (e) {
      console.warn('Clipboard image write failed:', e);
      // fall through to open-in-tab fallback
    }
  }

  // ── Fallback: open the image in a new tab so the user can long-press
  // (mobile) or right-click (desktop) → copy/save. Works on file:// and
  // browsers without ClipboardItem support.
  try {
    const dataUrl = oc.toDataURL('image/png');
    const w = window.open();
    if (w) {
      w.document.write(
        '<!doctype html><meta charset="utf-8">' +
        '<title>ANALOG output — long press to copy or save</title>' +
        '<meta name="viewport" content="width=device-width, initial-scale=1">' +
        '<style>body{margin:0;background:#0a0a0a;display:flex;align-items:center;' +
        'justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box;' +
        'font-family:ui-monospace,monospace;color:#6E6B65}' +
        'img{max-width:100%;max-height:90vh;image-rendering:pixelated;' +
        'box-shadow:0 0 60px rgba(255,107,0,0.12)}' +
        '.hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;' +
        'font-size:11px;text-transform:uppercase;letter-spacing:0.15em}</style>' +
        '<img src="' + dataUrl + '" alt="ANALOG output">' +
        '<div class="hint">long press · right click → copy image</div>'
      );
      w.document.close();
      flash('OPENED IN TAB ↗', 1800);
    } else {
      flash('POPUP BLOCKED', 2000);
    }
  } catch (e) {
    console.warn('Fallback failed:', e);
    flash('COPY FAILED', 1800);
  }
}

// ─── RANDOMIZE ──────────────────────────────────────────────────
function randomize() {
  const modes = ['floyd', 'atkinson', 'bayer', 'halftone', 'threshold', 'noise'];
  const pals  = ['mono', 'amber', 'green', 'red'];
  const rand = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  state.mode      = modes[rand(0, modes.length - 1)];
  state.palette   = pals[rand(0, pals.length - 1)];
  state.threshold = rand(80, 180);
  state.contrast  = rand(-15, 60);
  state.scale     = rand(1, 4);
  state.grain     = rand(0, 40);
  state.invert    = Math.random() < 0.25;
  state.scanlines = Math.random() < 0.35;
  state.vignette  = Math.random() < 0.35;
  // don't randomize pfp — it's user intent
  syncUI();
  render();
}

// ─── SAMPLE IMAGE (meta: dithered A becomes the logo) ───────────
function loadSample() {
  const c = document.createElement('canvas');
  c.width = 900; c.height = 900;
  const cx = c.getContext('2d');
  // vertical gradient
  const grad = cx.createLinearGradient(0, 0, 0, 900);
  grad.addColorStop(0,   '#ffffff');
  grad.addColorStop(0.5, '#7a7a7a');
  grad.addColorStop(1,   '#050505');
  cx.fillStyle = grad;
  cx.fillRect(0, 0, 900, 900);
  // huge A
  cx.fillStyle = '#000';
  cx.font = 'bold 820px Georgia, "Times New Roman", serif';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText('A', 450, 480);
  // sparkle of noise so dither has grain to bite
  const nd = cx.getImageData(0, 0, 900, 900);
  for (let i = 0; i < nd.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 24;
    nd.data[i]   += n;
    nd.data[i+1] += n;
    nd.data[i+2] += n;
  }
  cx.putImageData(nd, 0, 0);

  const img = new Image();
  img.onload = () => { state.sourceImage = img; render(); };
  img.src = c.toDataURL();
}

// ─── FILE LOADING ───────────────────────────────────────────────
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => { state.sourceImage = img; render(); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ─── UI WIRING ──────────────────────────────────────────────────
document.getElementById('load-btn').onclick   = () => document.getElementById('file-input').click();
document.getElementById('sample-btn').onclick = loadSample;
document.getElementById('file-input').onchange = (e) => loadFile(e.target.files[0]);
document.getElementById('download-btn').onclick = download;
document.getElementById('copy-btn').onclick = copyToClipboard;
document.getElementById('random-btn').onclick = randomize;

// mode buttons
document.querySelectorAll('#modes .btn-cell').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#modes .btn-cell').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    render();
  };
});

// palette buttons
document.querySelectorAll('#palettes .btn-cell').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#palettes .btn-cell').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.palette = btn.dataset.palette;
    render();
  };
});

// preset buttons
document.querySelectorAll('#presets .btn-cell').forEach(btn => {
  btn.onclick = () => {
    const p = presets[btn.dataset.preset];
    Object.assign(state, p);
    syncUI();
    render();
  };
});

// sliders
['threshold', 'contrast', 'scale', 'grain'].forEach(id => {
  document.getElementById(id).oninput = (e) => {
    state[id] = parseInt(e.target.value);
    updateSliderLabels();
    render();
  };
});

// toggles
function bindToggle(id, key) {
  const el = document.getElementById(id);
  el.onclick = () => {
    state[key] = !state[key];
    el.classList.toggle('on', state[key]);
    render();
  };
}
bindToggle('invert-toggle',   'invert');
bindToggle('scanlines-toggle','scanlines');
bindToggle('vignette-toggle', 'vignette');
bindToggle('pfp-toggle',      'pfp');

function updateSliderLabels() {
  document.getElementById('v-th').textContent = state.threshold;
  document.getElementById('v-co').textContent = state.contrast > 0 ? '+' + state.contrast : state.contrast;
  document.getElementById('v-sc').textContent = state.scale + '×';
  document.getElementById('v-gr').textContent = state.grain;
}

function syncUI() {
  document.querySelectorAll('#modes .btn-cell').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === state.mode));
  document.querySelectorAll('#palettes .btn-cell').forEach(b =>
    b.classList.toggle('active', b.dataset.palette === state.palette));
  document.getElementById('threshold').value = state.threshold;
  document.getElementById('contrast').value  = state.contrast;
  document.getElementById('scale').value     = state.scale;
  document.getElementById('grain').value     = state.grain;
  updateSliderLabels();
  document.getElementById('invert-toggle').classList.toggle('on', state.invert);
  document.getElementById('scanlines-toggle').classList.toggle('on', state.scanlines);
  document.getElementById('vignette-toggle').classList.toggle('on', state.vignette);
  document.getElementById('pfp-toggle').classList.toggle('on', state.pfp);
}

// ─── DRAG & DROP ────────────────────────────────────────────────
let dragCount = 0;
window.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragCount++;
  document.getElementById('drop-overlay').classList.add('active');
});
window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragCount--;
  if (dragCount <= 0) {
    dragCount = 0;
    document.getElementById('drop-overlay').classList.remove('active');
  }
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragCount = 0;
  document.getElementById('drop-overlay').classList.remove('active');
  loadFile(e.dataTransfer.files[0]);
});

// resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});

// ─── SOCIALS / CA ───────────────────────────────────────────────
// EDIT THESE THREE VALUES:
const CA_ADDRESS = '';
const X_HANDLE   = 'useanalog';                // without the @
const TG_URL     = 'https://t.me/useanalogportal';     // full URL

// wire social links
document.querySelector('.x-link').href  = `https://x.com/${X_HANDLE}`;
document.querySelector('.tg-link').href = TG_URL;

// display truncated CA
function formatCA(addr) {
  if (!addr || addr.length < 12) return addr || '—';
  return addr.slice(0, 6) + '…' + addr.slice(-4);
}
const caEl  = document.getElementById('ca-display');
const caVal = document.getElementById('ca-value');
caVal.textContent = formatCA(CA_ADDRESS);

caEl.onclick = async () => {
  const originalHTML = caVal.textContent;
  try {
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(CA_ADDRESS);
    } else {
      const ta = document.createElement('textarea');
      ta.value = CA_ADDRESS;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    caEl.classList.add('copied');
    caVal.textContent = 'COPIED';
  } catch (e) {
    caVal.textContent = 'ERROR';
    caEl.classList.add('copied');
  }
  setTimeout(() => {
    caEl.classList.remove('copied');
    caVal.textContent = originalHTML;
  }, 1200);
};

// ─── INIT ───────────────────────────────────────────────────────
updateSliderLabels();
loadSample();
</script>
